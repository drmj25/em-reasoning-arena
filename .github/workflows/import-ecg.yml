name: Import authentic PTB-XL ECG reference
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-ecg.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original waveform and render offline SVG
        run: |
          mkdir -p ecg
          python3 - <<'PY'
          import urllib.request, struct, html, pathlib
          base='https://physionet.org/files/ptb-xl/1.0.3/records100/00000/00001_lr.'
          head=urllib.request.urlopen(base+'hea',timeout=40).read().decode()
          raw=urllib.request.urlopen(base+'dat',timeout=60).read()
          lines=head.splitlines()
          assert lines[0].split()[:4]==['00001_lr','12','100','1000']
          assert len(raw)==1000*12*2, f'unexpected data length {len(raw)}'
          names=[]; gains=[]
          for line in lines[1:13]:
              f=line.split()
              assert f[1]=='16' and '/mV' in f[2]
              names.append(f[-1]);gains.append(float(f[2].split('(')[0].split('/')[0]))
          assert names==['I','II','III','AVR','AVL','AVF','V1','V2','V3','V4','V5','V6']
          vals=struct.unpack('<12000h',raw)
          width=1300;height=1100; left=85; top=85; xscale=110; yscale=72
          linesvg=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1100" role="img" aria-label="PTB-XL record 00001, twelve lead ECG, 10 seconds at 100Hz">','<rect width="1300" height="1100" fill="#fffafa"/>']
          for x in range(0,width,11):
              linesvg.append(f'<path d="M{x} 0V{height}" stroke="#f5d9dc" stroke-width=".5"/>')
          for y in range(0,height,14):
              linesvg.append(f'<path d="M0 {y}H{width}" stroke="#f5d9dc" stroke-width=".5"/>')
          for k,name in enumerate(names):
              row=k; baseline=110+row*78
              pts=[]
              for t in range(1000):
                  v=vals[t*12+k]/gains[k]
                  pts.append(f'{left+t*1.10:.1f},{baseline-v*yscale:.1f}')
              linesvg.append(f'<text x="12" y="{baseline+5}" font-family="Arial" font-size="18" fill="#222">{html.escape(name)}</text>')
              linesvg.append(f'<polyline points="{" ".join(pts)}" fill="none" stroke="#181818" stroke-width="1.3"/>')
          linesvg.append('<text x="85" y="35" font-family="Arial" font-size="19" fill="#222">PTB-XL 00001 • authentic recorded signals • 10 s • 100 Hz • 1 mV = 72 px</text>')
          linesvg.append('<text x="85" y="1065" font-family="Arial" font-size="15" fill="#222">Reference recording from a separate patient — NOT the fictional chest-pain patient; do not score diagnosis from this image.</text></svg>')
          pathlib.Path('ecg/ptbxl_00001_reference.svg').write_text('\n'.join(linesvg))
          PY
      - name: Commit waveform asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecg/ptbxl_00001_reference.svg
          git diff --cached --quiet || (git commit -m "Import original PTB-XL ECG reference waveform" && git push)
